name: Build Mobile App

# Compile l'APK Android (Capacitor) et publie la PWA sur GitHub Pages.
# Les runners GitHub atteignent les serveurs Google, ce qui permet de
# télécharger le SDK Android et les dépendances Gradle.

on:
  push:
    branches: [ main, "claude/**" ]
    paths: [ "mobile/**", ".github/workflows/build-mobile.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: comptabilite-pro-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  deploy-pwa:
    name: Deploy PWA to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload Pages artifact (mobile/www)
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/www
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
